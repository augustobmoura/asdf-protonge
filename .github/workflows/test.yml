name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  plugin_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Test plugin
        uses: asdf-vm/actions/plugin-test@v4.0.1
        with:
          command: ls ~/.steam/root/compatibilitytools.d/*
